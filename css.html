<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 49vh; 
            margin: 0;
            font-family: sans-serif;
            gap: 3px; 
        }

        div {
            width: 100px;
            height: 100px;
            transition: width .7s
        }

        
        .div1 {
            background-color: rgb(0, 138, 138);
        }

       
        .div2 {
            background-color: rgb(230, 95, 68);
        }

        
        .div3 {
            background-color: rgb(230, 175, 46);
        }

        
        div:hover {
            width: 500px;
            max-width: 90vw; 
        }
    </style>
</head>
<body>
    <h1>ANIMATION</h1>
    <div class="div1"><h1 align="center">Teal</h1></div>
    <div class="div2"><h2 align="center">Red Orange</h2></div>
    <div class="div3"><h1 align="center">Gold</h1></div>
</body>
</html>
